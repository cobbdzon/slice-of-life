<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" fill="none" role="img" aria-labelledby="lha-title">
  <title id="lha-title">A journal page, a calendar and a photo card in front of a dusk archway</title>

  <defs>
    <radialGradient id="lha-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fcb0d6" stop-opacity=".11"/>
      <stop offset="1" stop-color="#fcb0d6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="lha-sky" x1="260" y1="74" x2="260" y2="442" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#241621"/>
      <stop offset=".4" stop-color="#4d2a3d"/>
      <stop offset=".68" stop-color="#8c4a5a"/>
      <stop offset=".88" stop-color="#d48a6d"/>
      <stop offset="1" stop-color="#f3ba9b"/>
    </linearGradient>

    <radialGradient id="lha-sun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd8e9" stop-opacity=".5"/>
      <stop offset=".55" stop-color="#f3ba9b" stop-opacity=".18"/>
      <stop offset="1" stop-color="#f3ba9b" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="lha-sun" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#fff0e8"/>
      <stop offset=".65" stop-color="#ffdbc9"/>
      <stop offset="1" stop-color="#f3c1a5"/>
    </radialGradient>

    <linearGradient id="lha-photo" x1="404" y1="162" x2="404" y2="244" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c3b52"/>
      <stop offset=".55" stop-color="#b06468"/>
      <stop offset="1" stop-color="#f3ba9b"/>
    </linearGradient>

    <filter id="lha-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity=".38"/>
    </filter>

    <clipPath id="lha-arch">
      <path d="M138 442 V196 A122 122 0 0 1 382 196 V442 Z"/>
    </clipPath>

    <clipPath id="lha-calendar">
      <rect x="56" y="86" width="116" height="126" rx="26"/>
    </clipPath>

    <clipPath id="lha-photo-frame">
      <rect x="360" y="162" width="88" height="82" rx="12"/>
    </clipPath>
  </defs>

  <!-- Ambient warmth behind the scene -->
  <ellipse cx="260" cy="282" rx="246" ry="236" fill="url(#lha-glow)"/>

  <!-- Archway -->
  <path d="M128 452 V196 A132 132 0 0 1 392 196 V452 Z" fill="#5a2b44" stroke="#fcb0d6" stroke-opacity=".28" stroke-width="2"/>

  <g clip-path="url(#lha-arch)">
    <rect x="138" y="74" width="244" height="368" fill="url(#lha-sky)"/>

    <!-- Sun -->
    <circle cx="260" cy="212" r="98" fill="url(#lha-sun-glow)"/>
    <circle cx="260" cy="212" r="40" fill="url(#lha-sun)"/>

    <!-- Haze -->
    <rect x="234" y="232" width="56" height="6" rx="3" fill="#ffd8e9" fill-opacity=".13"/>
    <rect x="262" y="241" width="34" height="4" rx="2" fill="#ffd8e9" fill-opacity=".1"/>

    <!-- Clouds -->
    <rect x="170" y="140" width="52" height="7" rx="3.5" fill="#ffd8e9" fill-opacity=".22"/>
    <rect x="212" y="156" width="32" height="6" rx="3" fill="#ffd8e9" fill-opacity=".16"/>
    <rect x="300" y="124" width="40" height="6" rx="3" fill="#ffd8e9" fill-opacity=".18"/>

    <!-- Birds -->
    <path d="M198 242 q7 -6 14 0 q7 -6 14 0" stroke="#3a2230" stroke-opacity=".4" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M300 232 q5 -4 10 0 q5 -4 10 0" stroke="#3a2230" stroke-opacity=".32" stroke-width="2" stroke-linecap="round"/>

    <!-- Hills -->
    <path d="M138 442 V272 C 176 250 220 246 258 260 C 306 278 342 266 382 246 V442 Z" fill="#6c3453"/>
    <path d="M138 442 V286 C 190 268 232 266 272 282 C 312 298 348 292 382 278 V442 Z" fill="#3a2230"/>
  </g>

  <!-- Side sheet behind the page -->
  <rect x="122" y="260" width="288" height="196" rx="28" fill="#dfbdcc" transform="rotate(3 266 358)" filter="url(#lha-shadow)"/>

  <!-- Journal page -->
  <g transform="rotate(-4 256 366)" filter="url(#lha-shadow)">
    <rect x="298" y="252" width="20" height="36" rx="6" fill="#fcb0d6"/>
    <rect x="112" y="268" width="288" height="196" rx="26" fill="#ffdbc9"/>

    <!-- Entry label -->
    <rect x="136" y="294" width="52" height="12" rx="6" fill="#fcb0d6"/>
    <circle cx="144" cy="300" r="2.2" fill="#6c3453"/>
    <rect x="151" y="298" width="26" height="4" rx="2" fill="#6c3453" fill-opacity=".5"/>

    <!-- Entry title and lines -->
    <rect x="136" y="316" width="160" height="14" rx="7" fill="#311302" fill-opacity=".78"/>
    <rect x="136" y="346" width="238" height="8" rx="4" fill="#311302" fill-opacity=".3"/>
    <rect x="136" y="362" width="210" height="8" rx="4" fill="#311302" fill-opacity=".3"/>
    <rect x="136" y="378" width="226" height="8" rx="4" fill="#311302" fill-opacity=".3"/>
    <rect x="136" y="394" width="182" height="8" rx="4" fill="#311302" fill-opacity=".3"/>

    <!-- Private badge -->
    <circle cx="152" cy="426" r="17" fill="#6c3453"/>
    <path d="M147.5 426 v-4.5 a4.5 4.5 0 0 1 9 0 v4.5" stroke="#ffd8e9" stroke-width="2.4" stroke-linecap="round"/>
    <rect x="145" y="425" width="14" height="11" rx="3" fill="#ffd8e9"/>

    <!-- One day of the week -->
    <g fill="#311302" fill-opacity=".18">
      <circle cx="292" cy="426" r="5"/>
      <circle cx="314" cy="426" r="5"/>
      <circle cx="358" cy="426" r="5"/>
      <circle cx="380" cy="426" r="5"/>
    </g>
    <circle cx="336" cy="426" r="7" fill="#6c3453"/>
  </g>

  <!-- Media card -->
  <g transform="rotate(10 404 214)" filter="url(#lha-shadow)">
    <rect x="348" y="150" width="112" height="128" rx="20" fill="#3b3236" stroke="#504349" stroke-width="1.5"/>
    <g clip-path="url(#lha-photo-frame)">
      <rect x="360" y="162" width="88" height="82" fill="url(#lha-photo)"/>
      <circle cx="378" cy="182" r="7" fill="#ffd8e9" fill-opacity=".85"/>
      <path d="M360 232 C 376 214 392 216 404 226 C 418 236 434 226 448 212 V244 H360 Z" fill="#3a2230"/>
      <circle cx="404" cy="203" r="16" fill="#fcb0d6"/>
      <path d="M399.5 195.5 L399.5 210.5 L412 203 Z" fill="#511d3c"/>
    </g>
    <rect x="368" y="256" width="52" height="6" rx="3" fill="#eedfe3" fill-opacity=".35"/>
    <rect x="368" y="266" width="30" height="4" rx="2" fill="#eedfe3" fill-opacity=".2"/>
  </g>

  <!-- Calendar card -->
  <g transform="rotate(-7 114 149)" filter="url(#lha-shadow)">
    <rect x="86" y="76" width="10" height="26" rx="5" fill="#6c3453"/>
    <rect x="132" y="76" width="10" height="26" rx="5" fill="#6c3453"/>
    <rect x="56" y="86" width="116" height="126" rx="26" fill="#fdd9e8"/>
    <g clip-path="url(#lha-calendar)">
      <rect x="56" y="86" width="116" height="34" fill="#fcb0d6"/>
    </g>
    <g fill="#511d3c" fill-opacity=".22">
      <circle cx="86" cy="140" r="5"/>
      <circle cx="114" cy="140" r="5"/>
      <circle cx="142" cy="140" r="5"/>
      <circle cx="86" cy="164" r="5"/>
      <circle cx="142" cy="164" r="5"/>
      <circle cx="86" cy="188" r="5"/>
      <circle cx="114" cy="188" r="5"/>
      <circle cx="142" cy="188" r="5"/>
    </g>
    <circle cx="114" cy="164" r="7.5" fill="#6c3453"/>
  </g>

  <!-- Sparkles -->
  <g>
    <path d="M452 88 Q 454 94 460 96 Q 454 98 452 104 Q 450 98 444 96 Q 450 94 452 88 Z" fill="#fcb0d6" fill-opacity=".6"/>
    <path d="M74 234 Q 77 242 84 244 Q 77 246 74 254 Q 71 246 64 244 Q 71 242 74 234 Z" fill="#f3ba9b" fill-opacity=".55"/>
    <circle cx="482" cy="214" r="3" fill="#fcb0d6" fill-opacity=".35"/>
    <circle cx="62" cy="310" r="2.5" fill="#f3ba9b" fill-opacity=".35"/>
  </g>
</svg>
