<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 960" width="800" height="960" role="img" aria-label="Slice of Life illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#130c0f"/>
      <stop offset="55%" stop-color="#181115"/>
      <stop offset="100%" stop-color="#251d21"/>
    </linearGradient>
    <radialGradient id="blobPrimary" cx="0.3" cy="0.2" r="0.7">
      <stop offset="0%" stop-color="#6c3453" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6c3453" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobTertiary" cx="0.8" cy="0.15" r="0.6">
      <stop offset="0%" stop-color="#643d26" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#643d26" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobSecondary" cx="0.7" cy="0.85" r="0.6">
      <stop offset="0%" stop-color="#58404c" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#58404c" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <clipPath id="cardClip">
      <rect x="180" y="260" width="440" height="520" rx="28"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="960" fill="url(#bg)"/>

  <!-- Tonal blobs (MD3 tonal surfaces as depth) -->
  <rect width="800" height="960" fill="url(#blobPrimary)"/>
  <rect width="800" height="960" fill="url(#blobTertiary)"/>
  <rect width="800" height="960" fill="url(#blobSecondary)"/>

  <!-- Decorative MD3 vector shapes: rounded squircles -->
  <path d="M 640 120 Q 720 100 760 180 Q 780 260 700 280 Q 620 300 600 220 Q 580 140 640 120 Z" fill="#f3ba9b" fill-opacity="0.16"/>
  <path d="M 120 760 Q 60 700 100 640 Q 160 580 220 640 Q 260 720 180 780 Q 120 820 120 760 Z" fill="#fcb0d6" fill-opacity="0.14"/>
  <ellipse cx="400" cy="140" rx="120" ry="40" fill="#dfbdcc" fill-opacity="0.12"/>

  <!-- Expressive "slice" wedge accent (subject nod to "Slice of Life") -->
  <g transform="translate(90 230) rotate(-12)" opacity="0.9">
    <path d="M 0 0 L 150 0 A 150 150 0 0 1 40 144 Z" fill="#6c3453" fill-opacity="0.55"/>
    <path d="M 0 0 L 150 0 A 150 150 0 0 1 40 144 Z" fill="none" stroke="#fcb0d6" stroke-width="2" stroke-opacity="0.6"/>
    <circle cx="60" cy="40" r="6" fill="#fcb0d6" fill-opacity="0.8"/>
    <circle cx="95" cy="25" r="4" fill="#f3ba9b" fill-opacity="0.8"/>
    <circle cx="70" cy="80" r="5" fill="#dfbdcc" fill-opacity="0.8"/>
  </g>

  <!-- Floating chips (MD3 chip-like pills) -->
  <g opacity="0.9">
    <rect x="60" y="90" width="150" height="36" rx="18" fill="#58404c"/>
    <circle cx="82" cy="108" r="9" fill="#dfbdcc"/>
    <rect x="98" y="102" width="96" height="12" rx="6" fill="#fdd9e8" fill-opacity="0.85"/>

    <rect x="560" y="820" width="170" height="36" rx="18" fill="#6c3453"/>
    <circle cx="582" cy="838" r="9" fill="#fcb0d6"/>
    <rect x="598" y="832" width="116" height="12" rx="6" fill="#ffd8e9" fill-opacity="0.85"/>
  </g>

  <!-- Rain drops -->
  <g fill="#f3ba9b" fill-opacity="0.5">
    <circle cx="140" cy="200" r="3"/>
    <circle cx="200" cy="170" r="2.5"/>
    <circle cx="700" cy="320" r="3"/>
    <circle cx="660" cy="260" r="2"/>
    <circle cx="720" cy="400" r="2.5"/>
    <circle cx="90" cy="520" r="2"/>
    <circle cx="740" cy="600" r="3"/>
  </g>

  <!-- Journal card (MD3 card, medium shape 12-28dp) -->
  <g filter="url(#softShadow)">
    <rect x="180" y="260" width="440" height="520" rx="28" fill="#30282b"/>
    <rect x="180" y="260" width="440" height="520" rx="28" fill="none" stroke="#504349" stroke-width="1" stroke-opacity="0.6"/>
  </g>

  <!-- Page lines -->
  <g clip-path="url(#cardClip)" opacity="0.55">
    <rect x="220" y="330" width="360" height="8" rx="4" fill="#d4c2c8" fill-opacity="0.35"/>
    <rect x="220" y="360" width="300" height="8" rx="4" fill="#d4c2c8" fill-opacity="0.35"/>
    <rect x="220" y="390" width="340" height="8" rx="4" fill="#d4c2c8" fill-opacity="0.35"/>
    <rect x="220" y="420" width="280" height="8" rx="4" fill="#d4c2c8" fill-opacity="0.35"/>
    <rect x="220" y="450" width="350" height="8" rx="4" fill="#d4c2c8" fill-opacity="0.35"/>
    <rect x="220" y="480" width="310" height="8" rx="4" fill="#d4c2c8" fill-opacity="0.35"/>
    <rect x="220" y="510" width="330" height="8" rx="4" fill="#d4c2c8" fill-opacity="0.35"/>
    <rect x="220" y="540" width="290" height="8" rx="4" fill="#d4c2c8" fill-opacity="0.35"/>
    <rect x="220" y="570" width="345" height="8" rx="4" fill="#d4c2c8" fill-opacity="0.35"/>
    <rect x="220" y="600" width="270" height="8" rx="4" fill="#d4c2c8" fill-opacity="0.35"/>
    <rect x="220" y="630" width="320" height="8" rx="4" fill="#d4c2c8" fill-opacity="0.35"/>
    <rect x="220" y="660" width="260" height="8" rx="4" fill="#d4c2c8" fill-opacity="0.35"/>
  </g>

  <!-- Bookmark ribbon (primary, full shape pill) -->
  <path d="M 560 260 L 600 260 L 600 360 L 580 340 L 560 360 Z" fill="#fcb0d6" fill-opacity="0.9"/>

  <!-- Pen (stylized) -->
  <g transform="translate(500 700) rotate(-35)">
    <rect x="0" y="0" width="120" height="16" rx="8" fill="#f3ba9b"/>
    <rect x="108" y="0" width="24" height="16" rx="4" fill="#643d26"/>
    <polygon points="0,0 -18,8 0,16" fill="#eedfe3"/>
  </g>

  <!-- Coffee cup -->
  <g transform="translate(120 780)">
    <rect x="0" y="20" width="80" height="70" rx="12" fill="#58404c"/>
    <path d="M 80 30 Q 110 30 110 60 Q 110 90 80 90" fill="none" stroke="#dfbdcc" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="40" cy="20" rx="40" ry="10" fill="#dfbdcc" fill-opacity="0.6"/>
    <path d="M 20 0 Q 28 -20 36 0 Q 44 -20 52 0" fill="none" stroke="#f3ba9b" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Sparkle accents (MD3 expressive) -->
  <g fill="#fcb0d6">
    <path d="M 300 200 L 306 212 L 318 218 L 306 224 L 300 236 L 294 224 L 282 218 L 294 212 Z" opacity="0.8"/>
    <path d="M 620 470 L 624 478 L 632 482 L 624 486 L 620 494 L 616 486 L 608 482 L 616 478 Z" opacity="0.7"/>
  </g>

  <!-- Bottom wave/shape -->
  <path d="M 0 900 Q 200 860 400 900 T 800 900 L 800 960 L 0 960 Z" fill="#251d21" fill-opacity="0.6"/>
</svg>